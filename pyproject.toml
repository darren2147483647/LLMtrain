[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtrain"
version = "0.1.0"
description = "Fine-tune a Traditional Chinese multimodal QA model with LLaMA-Factory"
requires-python = ">=3.11"
# Ranges follow LLaMA-Factory's own pyproject.toml at the pinned commit.
dependencies = [
    "llamafactory @ git+https://github.com/hiyouga/LLaMA-Factory.git@8bf48110e1b86f66e352d10b1a45a6d6e03142e1",
    # Install the torch wheel for the machine's CUDA version first (RUNBOOK.md, step 1).
    "torch>=2.4.0",
    "datasets>=2.16.0,<=4.0.0",
    # >=5.5.0: first release with the gemma4 model type; upper bound is LLaMA-Factory's.
    "transformers>=5.5.0,<=5.8.0,!=5.6.0",
    "huggingface_hub",
    # QLoRA (quantization_bit: 4); same range as LLaMA-Factory requirements/bitsandbytes.txt
    "bitsandbytes>=0.39.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
