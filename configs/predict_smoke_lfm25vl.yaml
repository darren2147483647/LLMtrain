# Generate answers for the test split with the smoke model, optionally with a trained adapter:
#   python -m llmtrain.run predict configs/predict_smoke_lfm25vl.yaml --data data/mmqa [--adapter runs/<run>]
# Writes <output_dir>/generated_predictions.jsonl, which llmtrain.scoring reads.

### model
model_name_or_path: LiquidAI/LFM2.5-VL-1.6B
image_max_pixels: 262144
quantization_bit: 4  # same quantised base the adapter was trained on
quantization_method: bnb
trust_remote_code: true

### method
stage: sft
do_predict: true
finetuning_type: lora

### dataset
eval_dataset: mmqa_test
template: lfm2_vl
cutoff_len: 4096
preprocessing_num_workers: 4

### predict
per_device_eval_batch_size: 1
predict_with_generate: true
do_sample: false
max_new_tokens: 512
report_to: none
